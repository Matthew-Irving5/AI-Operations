[functions.agent-runtime-contracts]
enabled = true
verify_jwt = true
import_map = "./functions/agent-runtime-contracts/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/agent-runtime-contracts/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/agent-runtime-contracts/*.html" ]

[functions.onboarding-accept]
verify_jwt = true

[functions.schedule-update]
verify_jwt = true

[api]
enabled = true
port = 54321
[db]
port = 54322

[db.seed]
sql_paths = ["./seed.sql", "./fixtures/local_application_role_acl_baseline.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 10
token_verifications = 30

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 1800

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
max_enrolled_factors = 1
