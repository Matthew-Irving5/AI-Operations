name: Database full regression
on:
  workflow_dispatch:
  schedule:
    - cron: '11 4 * * 0,3'

concurrency:
  group: database-full-regression
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  migrations-and-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - name: Verify historical backfill, current pgTAP and local drift
        run: pnpm test:db
