name: Database full regression
on:
  workflow_dispatch:
  schedule:
    - cron: '11 4 * * *'

concurrency:
  group: database-full-regression
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  migrations-and-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase test db
