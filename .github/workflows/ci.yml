name: CI
on: [pull_request, merge_group]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    outputs:
      worker_changed: ${{ steps.impact.outputs.worker_changed }}
      db_changed: ${{ steps.impact.outputs.db_changed }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: impact
        shell: bash
        run: |
          base="origin/${GITHUB_BASE_REF:-main}"
          if git diff --name-only "$base...HEAD" | grep -q '^apps/windows-worker/'; then
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker_changed=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$base...HEAD" | grep -Eq '^(supabase/(migrations|tests)/|supabase/(seed\.sql|config\.toml)$|packages/db/src/database\.types\.ts$)'; then
            echo "db_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "db_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run independent changed-surface core checks
        run: pnpm verify:changed --lane=pr
      - name: Verify local platform role lookup contract
        run: node --test infrastructure/scripts/platform-role-lookup.test.mjs

  windows-worker:
    needs: core
    if: needs.core.outputs.worker_changed == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest ruff build
      - run: ruff check src tests
      - run: python -m pytest
      - run: python -m build


  database-contract:
    needs: core
    if: needs.core.outputs.db_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Verify isolated local SQL migrations, RLS and RPCs
        run: |
          pnpm exec supabase start
          pnpm exec supabase db reset --local
          pnpm exec supabase test db

  ready:
    needs: [core, windows-worker, database-contract]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require fast core and every impacted contract lane
        env:
          CORE_RESULT: ${{ needs.core.result }}
          WORKER_CHANGED: ${{ needs.core.outputs.worker_changed }}
          WORKER_RESULT: ${{ needs.windows-worker.result }}
          DB_CHANGED: ${{ needs.core.outputs.db_changed }}
          DB_RESULT: ${{ needs.database-contract.result }}
        run: |
          set -euo pipefail
          [[ "$CORE_RESULT" == 'success' ]] || { echo 'Fast CI core did not pass.'; exit 1; }
          if [[ "$WORKER_CHANGED" == 'true' && "$WORKER_RESULT" != 'success' ]]; then
            echo 'Changed Windows Worker tests did not pass.'
            exit 1
          fi
          if [[ "$DB_CHANGED" == 'true' && "$DB_RESULT" != 'success' ]]; then
            echo 'Changed database schema/RLS/RPC tests did not pass.'
            exit 1
          fi
          echo 'All impacted CI lanes passed.'
