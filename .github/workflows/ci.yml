name: CI
on: [pull_request, merge_group]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    outputs:
      worker_changed: ${{ steps.impact.outputs.worker_changed }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: impact
        shell: bash
        run: |
          base="origin/${GITHUB_BASE_REF:-main}"
          if git diff --name-only "$base...HEAD" | grep -q '^apps/windows-worker/'; then
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate ticket startup readback
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          TICKET_CONTEXT: ${{ github.event.pull_request.title }}
        run: node infrastructure/scripts/ticket-readback.mjs check
      - run: pnpm verify:changed --lane=core

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.18.0, cache: pnpm }
      - uses: denoland/setup-deno@v2
      - run: pnpm install --frozen-lockfile
      - name: Pre-pull Supabase images sequentially
        shell: bash
        run: |
          set -euo pipefail
          images=(
            public.ecr.aws/supabase/edge-runtime:v1.76.2
            public.ecr.aws/supabase/gotrue:v2.197.0
            public.ecr.aws/supabase/kong:2.8.1
            public.ecr.aws/supabase/pg_prove:3.36
            public.ecr.aws/supabase/postgres-meta:v0.99.0
            public.ecr.aws/supabase/postgres:17.6.1.171
            public.ecr.aws/supabase/postgrest:v16.3
            public.ecr.aws/supabase/realtime:v2.135.3
            public.ecr.aws/supabase/storage-api:v1.77.0
          )
          for image in "${images[@]}"; do
            pulled=false
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                pulled=true
                break
              fi
              sleep $((attempt * 10))
            done
            if [ "$pulled" != true ]; then
              echo "Unable to pre-pull $image after three attempts" >&2
              exit 1
            fi
            sleep 3
          done
      - run: pnpm verify:changed --lane=boundary

  windows-worker:
    needs: core
    if: needs.core.outputs.worker_changed == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest ruff build
      - run: ruff check src tests
      - run: python -m pytest
      - run: python -m build
