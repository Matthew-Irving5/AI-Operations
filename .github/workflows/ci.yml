name: CI
on: [pull_request, merge_group]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    outputs:
      worker_changed: ${{ steps.impact.outputs.worker_changed }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: impact
        shell: bash
        run: |
          base="origin/${GITHUB_BASE_REF:-main}"
          if git diff --name-only "$base...HEAD" | grep -q '^apps/windows-worker/'; then
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate ticket startup readback
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          TICKET_CONTEXT: ${{ github.event.pull_request.title }}
        run: node infrastructure/scripts/ticket-readback.mjs check
      - run: pnpm verify:changed --lane=core

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.18.0, cache: pnpm }
      - uses: denoland/setup-deno@v2
      - run: pnpm install --frozen-lockfile
      - name: Pre-pull Supabase images sequentially
        shell: bash
        run: |
          set -euo pipefail
          # Pull through the public GHCR mirror. Supabase CLI still requests
          # the original ECR tags, so retag each pulled image locally first.
          image_pairs=(
            "ghcr.io/matthew-irving5/ai-operations-supabase/edge-runtime:v1.76.2|public.ecr.aws/supabase/edge-runtime:v1.76.2"
            "ghcr.io/matthew-irving5/ai-operations-supabase/gotrue:v2.197.0|public.ecr.aws/supabase/gotrue:v2.197.0"
            "ghcr.io/matthew-irving5/ai-operations-supabase/kong:2.8.1|public.ecr.aws/supabase/kong:2.8.1"
            "ghcr.io/matthew-irving5/ai-operations-supabase/pg_prove:3.36|public.ecr.aws/supabase/pg_prove:3.36"
            "ghcr.io/matthew-irving5/ai-operations-supabase/postgres-meta:v0.99.0|public.ecr.aws/supabase/postgres-meta:v0.99.0"
            "ghcr.io/matthew-irving5/ai-operations-supabase/postgres:17.6.1.171|public.ecr.aws/supabase/postgres:17.6.1.171"
            "ghcr.io/matthew-irving5/ai-operations-supabase/postgrest:v16.3|public.ecr.aws/supabase/postgrest:v16.3"
            "ghcr.io/matthew-irving5/ai-operations-supabase/realtime:v2.135.3|public.ecr.aws/supabase/realtime:v2.135.3"
            "ghcr.io/matthew-irving5/ai-operations-supabase/storage-api:v1.77.0|public.ecr.aws/supabase/storage-api:v1.77.0"
          )
          for pair in "${image_pairs[@]}"; do
            mirror="${pair%%|*}"
            image="${pair#*|}"
            pulled=false
            for attempt in 1 2 3; do
              if docker pull "$mirror"; then
                pulled=true
                break
              fi
              sleep $((attempt * 10))
            done
            if [ "$pulled" != true ]; then
              echo "Unable to pre-pull $mirror after three attempts" >&2
              exit 1
            fi
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$mirror")"
            if [ -z "$digest" ]; then
              echo "Mirror image has no immutable digest: $mirror" >&2
              exit 1
            fi
            echo "Using $mirror at $digest as $image"
            docker tag "$mirror" "$image"
            sleep 3
          done
      - run: pnpm verify:changed --lane=boundary

  windows-worker:
    needs: core
    if: needs.core.outputs.worker_changed == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest ruff build
      - run: ruff check src tests
      - run: python -m pytest
      - run: python -m build
