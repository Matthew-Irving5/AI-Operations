name: Deploy staging
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate staging environment identity
        env:
          GITHUB_CONFIG_SECRET_NAMES: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && 'CLOUDFLARE_ACCOUNT_ID,' || '' }}${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'CLOUDFLARE_API_TOKEN,' || '' }}${{ secrets.FINANCE_ARCHIVE_GATEWAY_SECRET != '' && 'FINANCE_ARCHIVE_GATEWAY_SECRET,' || '' }}${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN != '' && 'STAGING_SUPABASE_ACCESS_TOKEN,' || '' }}${{ secrets.STAGING_SUPABASE_ANON_KEY != '' && 'STAGING_SUPABASE_ANON_KEY,' || '' }}${{ secrets.STAGING_SUPABASE_DB_PASSWORD != '' && 'STAGING_SUPABASE_DB_PASSWORD,' || '' }}${{ secrets.STAGING_SUPABASE_PROJECT_REF != '' && 'STAGING_SUPABASE_PROJECT_REF,' || '' }}${{ secrets.STAGING_SUPABASE_URL != '' && 'STAGING_SUPABASE_URL' || '' }}
          GITHUB_CONFIG_VARIABLE_NAMES: ${{ vars.FINANCE_ARCHIVE_GATEWAY_URL != '' && 'FINANCE_ARCHIVE_GATEWAY_URL' || '' }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_PUBLIC_APP_ORIGIN: https://ai-operations-staging.ai-operations.workers.dev
          APP_ENV: staging
          WORKER_NAME: ai-operations-staging
          ARCHIVE_BUCKET_NAME: ai-operations-staging
        run: pnpm environment:drift -- validate-staging
      - name: Deploy Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: pnpm run deploy -- --config wrangler.jsonc
      - name: Configure staging finance archive gateway secret
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FINANCE_ARCHIVE_GATEWAY_SECRET: ${{ secrets.FINANCE_ARCHIVE_GATEWAY_SECRET }}
        run: |
          test -n "$FINANCE_ARCHIVE_GATEWAY_SECRET" || { echo "Missing staging secret: FINANCE_ARCHIVE_GATEWAY_SECRET"; exit 1; }
          printf '%s' "$FINANCE_ARCHIVE_GATEWAY_SECRET" | pnpm exec wrangler secret put FINANCE_ARCHIVE_GATEWAY_SECRET --config wrangler.jsonc
      - name: Apply staging migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          npx supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          npx supabase db push --linked --password "$DB_PASSWORD" --yes
      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          FINANCE_ARCHIVE_GATEWAY_URL: ${{ vars.FINANCE_ARCHIVE_GATEWAY_URL }}
          FINANCE_ARCHIVE_GATEWAY_SECRET: ${{ secrets.FINANCE_ARCHIVE_GATEWAY_SECRET }}
          # GitHub environment secret names cannot use the GITHUB_ prefix. Keep the
          # provider-facing Supabase secret name stable while reading the operator's
          # PERSONAL_READ_TOKEN environment secret here.
          GITHUB_PERSONAL_READ_TOKEN: ${{ secrets.PERSONAL_READ_TOKEN }}
        run: |
          test -n "$FINANCE_ARCHIVE_GATEWAY_URL" || { echo "Missing staging variable: FINANCE_ARCHIVE_GATEWAY_URL"; exit 1; }
          test -n "$FINANCE_ARCHIVE_GATEWAY_SECRET" || { echo "Missing staging secret: FINANCE_ARCHIVE_GATEWAY_SECRET"; exit 1; }
          npx supabase secrets set PUBLIC_APP_ORIGIN=https://ai-operations-staging.ai-operations.workers.dev FINANCE_ARCHIVE_GATEWAY_URL="$FINANCE_ARCHIVE_GATEWAY_URL" FINANCE_ARCHIVE_GATEWAY_SECRET="$FINANCE_ARCHIVE_GATEWAY_SECRET" --project-ref "$PROJECT_REF"
          if [ -n "$GITHUB_PERSONAL_READ_TOKEN" ]; then
            npx supabase secrets set GITHUB_PERSONAL_READ_TOKEN="$GITHUB_PERSONAL_READ_TOKEN" --project-ref "$PROJECT_REF"
          else
            echo "PERSONAL_READ_TOKEN is not configured; Career sync will fail closed with github_connection_unavailable until the protected secret is added."
          fi
          for function in supabase/functions/*; do
            [[ "$(basename "$function")" == _* ]] && continue
            deployed=false
            for attempt in 1 2 3; do
              if npx supabase functions deploy "$(basename "$function")" --project-ref "$PROJECT_REF" --use-api; then
                deployed=true
                break
              fi
              echo "Function $(basename "$function") deployment attempt $attempt failed; retrying if attempts remain."
              sleep $((attempt * 10))
            done
          if [[ "$deployed" != true ]]; then
              echo "Function $(basename "$function") failed after three bounded attempts."
              exit 1
            fi
          done
      - name: Check repo to staging drift
        env:
          GITHUB_CONFIG_SECRET_NAMES: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && 'CLOUDFLARE_ACCOUNT_ID,' || '' }}${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'CLOUDFLARE_API_TOKEN,' || '' }}${{ secrets.FINANCE_ARCHIVE_GATEWAY_SECRET != '' && 'FINANCE_ARCHIVE_GATEWAY_SECRET,' || '' }}${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN != '' && 'STAGING_SUPABASE_ACCESS_TOKEN,' || '' }}${{ secrets.STAGING_SUPABASE_ANON_KEY != '' && 'STAGING_SUPABASE_ANON_KEY,' || '' }}${{ secrets.STAGING_SUPABASE_DB_PASSWORD != '' && 'STAGING_SUPABASE_DB_PASSWORD,' || '' }}${{ secrets.STAGING_SUPABASE_PROJECT_REF != '' && 'STAGING_SUPABASE_PROJECT_REF,' || '' }}${{ secrets.STAGING_SUPABASE_URL != '' && 'STAGING_SUPABASE_URL' || '' }}
          GITHUB_CONFIG_VARIABLE_NAMES: ${{ vars.FINANCE_ARCHIVE_GATEWAY_URL != '' && 'FINANCE_ARCHIVE_GATEWAY_URL' || '' }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DRIFT_REPORT_PATH: environment-drift.json
        run: pnpm environment:drift -- repo-staging
      - name: Smoke test staging Worker
        run: |
          for attempt in {1..18}; do
            status="$(curl --silent --show-error --location --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              https://ai-operations-staging.ai-operations.workers.dev/login || true)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            echo "Attempt $attempt returned HTTP ${status:-no-response}; waiting for deployment propagation."
            sleep 5
          done
          echo "Staging Worker did not return HTTP 200 within 90 seconds."
          exit 1
      - name: Upload staging environment inventory
        if: always() && hashFiles('environment-drift.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: staging-environment-inventory
          path: environment-drift.json
          if-no-files-found: error
          retention-days: 7
