name: E2E
on: [pull_request, merge_group]
jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - name: Configure the synthetic local Supabase session
        shell: bash
        run: |
          supabase_env="$(pnpm exec supabase status -o env)"
          anon_key="$(printf '%s\n' "$supabase_env" | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')"
          jwt_secret="$(printf '%s\n' "$supabase_env" | sed -n 's/^JWT_SECRET="\(.*\)"$/\1/p')"
          test -n "$anon_key"
          test -n "$jwt_secret"
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon_key" >> "$GITHUB_ENV"
          echo "E2E_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-artifacts, path: test-results }
