name: Staging capability acceptance status

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate SHA that completed hosted staging acceptance.
        required: true
        type: string
      deployment_run_id:
        description: Successful Staging candidate gate run that deployed this SHA.
        required: true
        type: string
      outcome:
        description: Result of the headed staging acceptance session.
        required: true
        type: choice
        options: [accepted, failed]
      acceptance_evidence:
        description: Redacted JSON emitted by the headed staging runner; required for accepted.
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: staging-acceptance-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate candidate identifier and mark manual acceptance pending
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          OUTCOME: ${{ inputs.outcome }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Candidate SHA is invalid."; exit 1; }
          if [[ "$OUTCOME" == "accepted" ]]; then
            jq -n '{state:"pending",context:"AI Operations / Staging capability acceptance",description:"Validating hosted staging acceptance evidence."}' > commit-status.json
          else
            jq -n '{state:"failure",context:"AI Operations / Staging capability acceptance",description:"Staging acceptance failed: capability_failed."}' > commit-status.json
          fi
          gh api "repos/$GH_REPOSITORY/statuses/$CANDIDATE_SHA" --method POST --input commit-status.json > /dev/null
      - name: Record an explicit hosted acceptance failure
        if: inputs.outcome == 'failed'
        run: |
          echo "Hosted capability acceptance failed; the candidate remains unmergeable."
      - name: Verify current open PR and successful candidate deployment run
        if: inputs.outcome == 'accepted'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "Deployment run ID is invalid."; exit 1; }
          gh api "repos/$GH_REPOSITORY/commits/$CANDIDATE_SHA/pulls" > candidate-pulls.json
          pr_count="$(jq --arg repo "$GH_REPOSITORY" --arg sha "$CANDIDATE_SHA" '[.[] | select(.state == "open" and .base.ref == "main" and .head.sha == $sha and .head.repo.full_name == $repo)] | length' candidate-pulls.json)"
          [[ "$pr_count" == "1" ]] || { echo "Candidate must match exactly one open same-repository PR targeting main."; exit 1; }
          pr_number="$(jq -r --arg repo "$GH_REPOSITORY" --arg sha "$CANDIDATE_SHA" '.[] | select(.state == "open" and .base.ref == "main" and .head.sha == $sha and .head.repo.full_name == $repo) | .number' candidate-pulls.json)"
          gh api "repos/$GH_REPOSITORY/pulls/$pr_number" > current-pr.json
          jq -e --arg repo "$GH_REPOSITORY" --arg sha "$CANDIDATE_SHA" '
            .number > 0 and .state == "open" and .base.ref == "main" and
            .head.sha == $sha and .head.repo.full_name == $repo
          ' current-pr.json > /dev/null || { echo "Current PR head no longer matches the staged candidate."; exit 1; }
          gh api "repos/$GH_REPOSITORY/git/commits/$CANDIDATE_SHA" > candidate-commit.json
          candidate_tree_sha="$(jq -r '.tree.sha' candidate-commit.json)"
          [[ "$candidate_tree_sha" =~ ^[a-f0-9]{40}$ ]] || { echo "GitHub candidate tree SHA is invalid."; exit 1; }
          gh api "repos/$GH_REPOSITORY/actions/runs/$DEPLOYMENT_RUN_ID" > deployment-run.json
          jq -e --arg repo "$GH_REPOSITORY" '
            .head_repository.full_name == $repo and .head_branch == "main" and
            .name == "Staging candidate gate" and .path == ".github/workflows/staging-candidate.yml" and
            .event == "workflow_run" and .status == "completed" and .conclusion == "success"
          ' deployment-run.json > /dev/null || { echo "Deployment run is not the successful exact-SHA staging candidate gate."; exit 1; }
          gh api "repos/$GH_REPOSITORY/actions/runs/$DEPLOYMENT_RUN_ID/artifacts?per_page=100" > deployment-artifacts.json
          artifact_count="$(jq --arg name "candidate-staging-deployment-$CANDIDATE_SHA" '[.artifacts[] | select(.name == $name and .expired == false and .size_in_bytes > 0)] | length' deployment-artifacts.json)"
          [[ "$artifact_count" == "1" ]] || { echo "Expected exactly one non-expired candidate deployment artifact."; exit 1; }
      - name: Download exact candidate deployment evidence
        if: inputs.outcome == 'accepted'
        uses: actions/download-artifact@v4
        with:
          name: candidate-staging-deployment-${{ inputs.candidate_sha }}
          path: deployment-evidence
          run-id: ${{ inputs.deployment_run_id }}
          github-token: ${{ github.token }}
      - name: Validate hosted acceptance against current PR head and deployment artifact
        id: validate
        if: inputs.outcome == 'accepted'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          ACCEPTANCE_EVIDENCE: ${{ inputs.acceptance_evidence }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const sha = process.env.CANDIDATE_SHA;
          const runId = process.env.DEPLOYMENT_RUN_ID;
          const submitted = JSON.parse(process.env.ACCEPTANCE_EVIDENCE ?? '');
          const deployment = JSON.parse(readFileSync('deployment-evidence/candidate-staging-deployment.json', 'utf8'));
          const run = JSON.parse(readFileSync('deployment-run.json', 'utf8'));
          const pulls = JSON.parse(readFileSync('candidate-pulls.json', 'utf8'));
          const currentPr = JSON.parse(readFileSync('current-pr.json', 'utf8'));
          const candidateCommit = JSON.parse(readFileSync('candidate-commit.json', 'utf8'));
          const matchingPrs = pulls.filter((pr) => pr.state === 'open' && pr.base?.ref === 'main' && pr.head?.sha === sha && pr.head?.repo?.full_name === process.env.GH_REPOSITORY);
          if (matchingPrs.length !== 1 || currentPr.number !== matchingPrs[0].number || currentPr.number !== submitted.pullRequestNumber || currentPr.number !== deployment.pullRequestNumber) {
            throw new Error('Hosted acceptance, deployment artifact, and current PR number do not match uniquely.');
          }
          const candidateTreeSha = candidateCommit.tree?.sha;
          if (!/^[a-f0-9]{40}$/.test(candidateTreeSha ?? '') || submitted.candidateTreeSha !== candidateTreeSha || deployment.candidateTreeSha !== candidateTreeSha) {
            throw new Error('Hosted acceptance and deployment artifact tree SHA must match the GitHub candidate commit tree.');
          }
          if (currentPr.state !== 'open' || currentPr.base?.ref !== 'main' || currentPr.head?.sha !== sha || currentPr.head?.repo?.full_name !== process.env.GH_REPOSITORY) {
            throw new Error('Current PR number/head/tree provenance does not match the staged candidate.');
          }
          if (deployment.candidateSha !== sha || deployment.runId !== runId || String(deployment.runAttempt) !== String(run.run_attempt)) {
            throw new Error('Deployment artifact does not match the supplied exact SHA and run identity.');
          }
          if (submitted.candidateSha !== sha || submitted.deploymentRunId !== runId || submitted.pullRequestNumber !== currentPr.number || submitted.candidateTreeSha !== candidateTreeSha) {
            throw new Error('Hosted acceptance does not match the supplied SHA, tree, PR, and deployment run.');
          }
          writeFileSync('staging-status-input.json', JSON.stringify({
            candidateSha: sha,
            currentPullRequestHeadSha: sha,
            currentPullRequestTreeSha: candidateTreeSha,
            currentPullRequestNumber: currentPr.number,
            state: 'success',
            deployment,
            hostedSuite: submitted,
          }) + '\n');
          NODE
          pnpm exec tsx infrastructure/scripts/release-gate.ts staging-status < staging-status-input.json > validated-acceptance.json
          jq '{schemaVersion:1,state:"STAGING_ACCEPTED",acceptance:.acceptance}' validated-acceptance.json > acceptance-evidence.json
          jq -n --arg sha "$CANDIDATE_SHA" '{candidateSha:$sha}' > validated-candidate.json
      - name: Upload validated hosted acceptance evidence
        if: inputs.outcome == 'accepted' && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: staging-capability-acceptance-${{ inputs.candidate_sha }}
          path: acceptance-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish accepted commit status
        if: inputs.outcome == 'accepted' && steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq --arg url "$WORKFLOW_RUN_URL" '.status + {target_url:$url}' validated-acceptance.json > commit-status.json
          gh api "repos/$GH_REPOSITORY/statuses/$CANDIDATE_SHA" --method POST --input commit-status.json > /dev/null
      - name: Fail closed for malformed, stale, or invalid hosted acceptance
        if: failure() && inputs.outcome == 'accepted'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            jq -n '{state:"failure",context:"AI Operations / Staging capability acceptance",description:"Staging acceptance failed: acceptance_malformed."}' > commit-status.json
            gh api "repos/$GH_REPOSITORY/statuses/$CANDIDATE_SHA" --method POST --input commit-status.json > /dev/null
          fi
