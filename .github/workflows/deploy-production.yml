name: Deploy production
on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: ID of the successful integrated-main push-to-staging workflow run
        required: true
        type: string
      expected_main_sha:
        description: Exact 40-character main commit SHA to promote
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve exact successful integrated-main staging run
        id: staging-run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          DISPATCH_SHA: ${{ github.sha }}
          PROMOTION_EVIDENCE_DIR: ${{ runner.temp }}/ai-operations-production-release-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          def github(path):
              return json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GH_REPOSITORY']}/{path}"], text=True))

          expected = os.environ['EXPECTED_MAIN_SHA']
          run_id = os.environ['STAGING_RUN_ID']
          if re.fullmatch(r'[a-f0-9]{40}', expected) is None or re.fullmatch(r'[1-9][0-9]{0,19}', run_id) is None:
              raise SystemExit('Invalid expected SHA or staging run ID')
          if expected != os.environ['DISPATCH_SHA']:
              raise SystemExit('Dispatch commit is not the requested main HEAD')
          main = github('git/ref/heads/main')
          if main['object']['sha'] != expected:
              raise SystemExit('Main advanced since release was requested')
          run = github(f'actions/runs/{run_id}')
          if any((
              run.get('head_repository', {}).get('full_name') != os.environ['GH_REPOSITORY'],
              run.get('name') != 'Deploy staging',
              run.get('path') != '.github/workflows/deploy-staging.yml',
              run.get('event') != 'push',
              run.get('head_branch') != 'main',
              run.get('head_sha') != expected,
              run.get('status') != 'completed',
              run.get('conclusion') != 'success',
          )):
              raise SystemExit('Staging workflow was not a successful push-to-main deployment of the requested SHA')
          tree = github(f'git/commits/{expected}')
          tree_sha = tree['tree']['sha']
          if re.fullmatch(r'[a-f0-9]{40}', tree_sha) is None:
              raise SystemExit('Invalid tree SHA')
          artifacts = github(f'actions/runs/{run_id}/artifacts?per_page=100').get('artifacts', [])
          for name in ('staging-environment-inventory', f'integrated-main-staging-{expected}'):
              matches = [a for a in artifacts if a.get('name') == name and not a.get('expired') and a.get('size_in_bytes', 0) > 0]
              if len(matches) != 1:
                  raise SystemExit('Missing or ambiguous trusted staging evidence: ' + name)
          directory = Path(os.environ['PROMOTION_EVIDENCE_DIR'])
          directory.mkdir(parents=True, exist_ok=True)
          for name, value in [('staging-run', run), ('main-commit', tree), ('main-ref', main)]:
              (directory / (name + '.json')).write_text(json.dumps(value) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={expected}\nrun_id={run_id}\ntree_sha={tree_sha}\n')
          PY
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.staging-run.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Download staging environment inventory
        uses: actions/download-artifact@v4
        with:
          name: staging-environment-inventory
          run-id: ${{ steps.staging-run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: staging-parity
      - name: Download verified integrated-main staging evidence
        uses: actions/download-artifact@v4
        with:
          name: integrated-main-staging-${{ steps.staging-run.outputs.sha }}
          run-id: ${{ steps.staging-run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: integrated-staging
      - name: Validate exact integrated-main promotion evidence
        env:
          GH_REPOSITORY: ${{ github.repository }}
          EXPECTED_MAIN_SHA: ${{ steps.staging-run.outputs.sha }}
          PROMOTION_EVIDENCE_DIR: ${{ runner.temp }}/ai-operations-production-release-evidence
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const read = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const base = process.env.PROMOTION_EVIDENCE_DIR;
          const run = read(base + '/staging-run.json');
          const main = read(base + '/main-commit.json');
          const evidence = read('integrated-staging/integrated-main-staging.json');
          const input = {
            repositoryFullName: process.env.GH_REPOSITORY,
            requestedSha: process.env.EXPECTED_MAIN_SHA,
            currentMainSha: process.env.EXPECTED_MAIN_SHA,
            mainTreeSha: main.tree.sha,
            stagingRun: {
              repositoryFullName: run.head_repository.full_name,
              name: run.name,
              path: run.path,
              headBranch: run.head_branch,
              headSha: run.head_sha,
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              runId: String(run.id),
              runAttempt: run.run_attempt,
            },
            evidence,
          };
          writeFileSync('integrated-main-promotion-input.json', JSON.stringify(input) + '\n');
          NODE
          pnpm exec tsx infrastructure/scripts/integrated-main-gate.ts < integrated-main-promotion-input.json > production-promotion-evidence.json
      - name: Validate production environment identity
        env:
          GITHUB_CONFIG_SECRET_NAMES: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && 'CLOUDFLARE_ACCOUNT_ID,' || '' }}${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'CLOUDFLARE_API_TOKEN,' || '' }}${{ secrets.FINANCE_ARCHIVE_GATEWAY_SECRET != '' && 'FINANCE_ARCHIVE_GATEWAY_SECRET,' || '' }}${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN != '' && 'PRODUCTION_SUPABASE_ACCESS_TOKEN,' || '' }}${{ secrets.PRODUCTION_SUPABASE_ANON_KEY != '' && 'PRODUCTION_SUPABASE_ANON_KEY,' || '' }}${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD != '' && 'PRODUCTION_SUPABASE_DB_PASSWORD,' || '' }}${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF != '' && 'PRODUCTION_SUPABASE_PROJECT_REF,' || '' }}${{ secrets.PRODUCTION_SUPABASE_URL != '' && 'PRODUCTION_SUPABASE_URL' || '' }}
          GITHUB_CONFIG_VARIABLE_NAMES: ${{ vars.FINANCE_ARCHIVE_GATEWAY_URL != '' && 'FINANCE_ARCHIVE_GATEWAY_URL' || '' }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_PUBLIC_APP_ORIGIN: https://ai-operations-production.ai-operations.workers.dev
          APP_ENV: production
          WORKER_NAME: ai-operations-production
          ARCHIVE_BUCKET_NAME: ai-operations-production
          STAGING_INVENTORY_PATH: staging-parity/environment-drift.json
          RELEASE_SHA: ${{ steps.staging-run.outputs.sha }}
        run: pnpm environment:drift -- validate-production
      - name: Validate production Supabase release secrets
        env:
          PRODUCTION_SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
        run: |
          test -n "$PRODUCTION_SUPABASE_ACCESS_TOKEN" || { echo "Missing production secret: PRODUCTION_SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$PRODUCTION_SUPABASE_PROJECT_REF" || { echo "Missing production secret: PRODUCTION_SUPABASE_PROJECT_REF"; exit 1; }
          test -n "$PRODUCTION_SUPABASE_DB_PASSWORD" || { echo "Missing production secret: PRODUCTION_SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$PRODUCTION_SUPABASE_URL" || { echo "Missing production secret: PRODUCTION_SUPABASE_URL"; exit 1; }
          test -n "$PRODUCTION_SUPABASE_ANON_KEY" || { echo "Missing production secret: PRODUCTION_SUPABASE_ANON_KEY"; exit 1; }
      - name: Capture production Edge Function source attestation
        env:
          RELEASE_SHA: ${{ steps.staging-run.outputs.sha }}
          SOURCE_ATTESTATION_PATH: function-source-attestation.json
        run: pnpm environment:drift -- attest-source
      - name: Validate staging and production source attestations
        env:
          RELEASE_SHA: ${{ steps.staging-run.outputs.sha }}
          SOURCE_ATTESTATION_PATH: function-source-attestation.json
          STAGING_INVENTORY_PATH: staging-parity/environment-drift.json
        run: pnpm environment:drift -- validate-release-attestation
      - name: Revalidate current main before first production mutation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EXPECTED_MAIN_SHA: ${{ steps.staging-run.outputs.sha }}
        run: |
          set -euo pipefail
          live_sha="$(gh api "repos/$GH_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$live_sha" = "$EXPECTED_MAIN_SHA" || { echo "Main advanced after release validation."; exit 1; }
      - name: Deploy Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          RELEASE_SHA: ${{ steps.staging-run.outputs.sha }}
        run: pnpm run deploy -- --config wrangler.production.jsonc --var "RELEASE_SHA:${RELEASE_SHA}"
      - name: Configure production finance archive gateway secret
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FINANCE_ARCHIVE_GATEWAY_SECRET: ${{ secrets.FINANCE_ARCHIVE_GATEWAY_SECRET }}
        run: |
          test -n "$FINANCE_ARCHIVE_GATEWAY_SECRET" || { echo "Missing production secret: FINANCE_ARCHIVE_GATEWAY_SECRET"; exit 1; }
          printf '%s' "$FINANCE_ARCHIVE_GATEWAY_SECRET" | pnpm exec wrangler secret put FINANCE_ARCHIVE_GATEWAY_SECRET --config wrangler.production.jsonc
      - name: Apply production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
        run: |
          pnpm exec supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          pnpm exec supabase db push --linked --include-all --password "$DB_PASSWORD" --yes
      - name: Deploy production Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          FINANCE_ARCHIVE_GATEWAY_URL: ${{ vars.FINANCE_ARCHIVE_GATEWAY_URL }}
          FINANCE_ARCHIVE_GATEWAY_SECRET: ${{ secrets.FINANCE_ARCHIVE_GATEWAY_SECRET }}
          # GitHub environment secret names cannot use the GITHUB_ prefix. Keep the
          # provider-facing Supabase secret name stable while reading the operator's
          # PERSONAL_READ_TOKEN environment secret here.
          GITHUB_PERSONAL_READ_TOKEN: ${{ secrets.PERSONAL_READ_TOKEN }}
        run: |
          test -n "$FINANCE_ARCHIVE_GATEWAY_URL" || { echo "Missing production variable: FINANCE_ARCHIVE_GATEWAY_URL"; exit 1; }
          test -n "$FINANCE_ARCHIVE_GATEWAY_SECRET" || { echo "Missing production secret: FINANCE_ARCHIVE_GATEWAY_SECRET"; exit 1; }
          pnpm exec supabase secrets set PUBLIC_APP_ORIGIN=https://ai-operations-production.ai-operations.workers.dev FINANCE_ARCHIVE_GATEWAY_URL="$FINANCE_ARCHIVE_GATEWAY_URL" FINANCE_ARCHIVE_GATEWAY_SECRET="$FINANCE_ARCHIVE_GATEWAY_SECRET" --project-ref "$PROJECT_REF"
          if [ -n "$GITHUB_PERSONAL_READ_TOKEN" ]; then
            pnpm exec supabase secrets set GITHUB_PERSONAL_READ_TOKEN="$GITHUB_PERSONAL_READ_TOKEN" --project-ref "$PROJECT_REF"
          else
            echo "PERSONAL_READ_TOKEN is not configured; Career sync will fail closed with github_connection_unavailable until the protected secret is added."
          fi
          for function in supabase/functions/*; do
            [[ -d "$function" ]] || continue
            [[ "$(basename "$function")" == _* ]] && continue
            deployed=false
            for attempt in 1 2 3; do
              if pnpm exec supabase functions deploy "$(basename "$function")" --project-ref "$PROJECT_REF" --use-api; then
                deployed=true
                break
              fi
              echo "Function $(basename "$function") deployment attempt $attempt failed; retrying if attempts remain."
              sleep $((attempt * 10))
            done
            if [[ "$deployed" != true ]]; then
              echo "Function $(basename "$function") failed after three bounded attempts."
              exit 1
            fi
          done
      - name: Check staging to production drift
        env:
          GITHUB_CONFIG_SECRET_NAMES: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && 'CLOUDFLARE_ACCOUNT_ID,' || '' }}${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'CLOUDFLARE_API_TOKEN,' || '' }}${{ secrets.FINANCE_ARCHIVE_GATEWAY_SECRET != '' && 'FINANCE_ARCHIVE_GATEWAY_SECRET,' || '' }}${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN != '' && 'PRODUCTION_SUPABASE_ACCESS_TOKEN,' || '' }}${{ secrets.PRODUCTION_SUPABASE_ANON_KEY != '' && 'PRODUCTION_SUPABASE_ANON_KEY,' || '' }}${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD != '' && 'PRODUCTION_SUPABASE_DB_PASSWORD,' || '' }}${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF != '' && 'PRODUCTION_SUPABASE_PROJECT_REF,' || '' }}${{ secrets.PRODUCTION_SUPABASE_URL != '' && 'PRODUCTION_SUPABASE_URL' || '' }}
          GITHUB_CONFIG_VARIABLE_NAMES: ${{ vars.FINANCE_ARCHIVE_GATEWAY_URL != '' && 'FINANCE_ARCHIVE_GATEWAY_URL' || '' }}
          PRODUCTION_SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_INVENTORY_PATH: staging-parity/environment-drift.json
          RELEASE_SHA: ${{ steps.staging-run.outputs.sha }}
          SOURCE_ATTESTATION_PATH: function-source-attestation.json
          DRIFT_REPORT_PATH: production-environment-drift.json
        run: pnpm environment:drift -- staging-production
      - name: Run bounded production capability smoke
        env:
          PRODUCTION_ORIGIN: https://ai-operations-production.ai-operations.workers.dev
          RELEASE_SHA: ${{ steps.staging-run.outputs.sha }}
          PRODUCTION_PROMOTION_PATH: production-promotion-evidence.json
          PRODUCTION_SMOKE_OUTPUT_PATH: production-smoke-evidence.json
        run: pnpm exec tsx infrastructure/scripts/production-smoke.ts
      - name: Upload production capability smoke evidence
        if: always() && hashFiles('production-smoke-evidence.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: production-capability-smoke-${{ steps.staging-run.outputs.sha }}
          path: production-smoke-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload production environment parity report
        if: always() && hashFiles('production-environment-drift.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: production-environment-parity
          path: production-environment-drift.json
          if-no-files-found: error
          retention-days: 30
