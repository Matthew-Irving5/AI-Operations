name: Windows worker full regression
on:
  workflow_dispatch:
  schedule:
    - cron: '29 4 * * *'

concurrency:
  group: windows-worker-full-regression
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest ruff build
      - run: ruff check src tests
      - run: python -m pytest
      - run: python -m build
