name: Live staging E2E safety guard

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the network-free staging/production target guard
        type: choice
        required: true
        default: mismatch
        options: [mismatch]

permissions:
  contents: read

concurrency:
  group: live-staging-e2e
  cancel-in-progress: false

jobs:
  target-guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run staging target guard and configuration tests
        run: |
          pnpm test:e2e:live:mismatch
          pnpm --filter @ai-operations/web exec vitest run lib/live-e2e-safety.test.ts
