name: Windows worker release

on:
  workflow_dispatch:
  push:
    tags: ['worker-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install worker and packaging tools
        working-directory: apps/windows-worker
        run: python -m pip install . pyinstaller==6.16.0
      - name: Build executable
        working-directory: apps/windows-worker
        run: pyinstaller --clean --onefile --name ai-operations-worker --paths src build_entry.py
      - name: Smoke test executable identity command
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'ai-operations-worker-smoke.key.dpapi'
          $output = & apps/windows-worker/dist/ai-operations-worker.exe identity --key-path $keyPath
          if ($LASTEXITCODE -ne 0) { throw "Worker identity smoke test exited with code $LASTEXITCODE" }
          $payload = $output | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($payload.publicKeyB64)) { throw 'Identity smoke test did not return publicKeyB64' }
          if ([string]::IsNullOrWhiteSpace($payload.fingerprintSha256)) { throw 'Identity smoke test did not return fingerprintSha256' }
          if ($output -match 'private|secret') { throw 'Identity smoke test output contains forbidden private material' }
          Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash apps/windows-worker/dist/ai-operations-worker.exe -Algorithm SHA256).Hash
          $hash | Set-Content apps/windows-worker/dist/ai-operations-worker.exe.sha256
          @{
            artifact = 'ai-operations-worker.exe'
            sha256 = $hash
            commit = '${{ github.sha }}'
            tag = '${{ github.ref_name }}'
            signed = $false
            signing = 'unsigned_private_deployment'
          } | ConvertTo-Json | Set-Content apps/windows-worker/dist/ai-operations-worker.provenance.json
          $provenance = Get-Content apps/windows-worker/dist/ai-operations-worker.provenance.json | ConvertFrom-Json
          if ($provenance.signed -ne $false) { throw 'Unsigned release provenance must contain signed: false' }
          if ($provenance.commit -ne '${{ github.sha }}') { throw 'Release provenance commit does not match the build commit' }
      - uses: actions/upload-artifact@v4
        with:
          name: ai-operations-windows-worker-${{ github.sha }}
          path: |
            apps/windows-worker/dist/ai-operations-worker.exe
            apps/windows-worker/dist/ai-operations-worker.exe.sha256
            apps/windows-worker/dist/ai-operations-worker.provenance.json
            apps/windows-worker/install-worker-task.ps1
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/windows-worker/dist/ai-operations-worker.exe
            apps/windows-worker/dist/ai-operations-worker.exe.sha256
            apps/windows-worker/dist/ai-operations-worker.provenance.json
            apps/windows-worker/install-worker-task.ps1
