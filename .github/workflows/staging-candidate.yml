name: Staging candidate gate

on:
  workflow_run:
    workflows:
      - CI
      - Database
      - Edge functions
      - E2E
      - Security
      - Performance
      - Windows worker foundation
      - CodeQL Advanced
      - Dependency review
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: staging-candidate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      candidate_ready: ${{ steps.validate.outputs.candidate_ready }}
      candidate_sha: ${{ steps.validate.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate candidate PR and latest required workflow attempts
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Candidate SHA is invalid."; exit 1; }
          gh api "repos/$GH_REPOSITORY/commits/$CANDIDATE_SHA/pulls" > candidate-pulls.json
          matches="$(jq --arg repo "$GH_REPOSITORY" --arg sha "$CANDIDATE_SHA" '[.[] | select(.state == "open" and .base.ref == "main" and .head.sha == $sha and .head.repo.full_name == $repo)] | length' candidate-pulls.json)"
          if [[ "$matches" != "1" ]]; then
            echo "Candidate must match exactly one open same-repository PR targeting main."
            exit 1
          fi
          pr_number="$(jq --arg repo "$GH_REPOSITORY" --arg sha "$CANDIDATE_SHA" -r '.[] | select(.state == "open" and .base.ref == "main" and .head.sha == $sha and .head.repo.full_name == $repo) | .number' candidate-pulls.json)"
          post_status() {
            pnpm exec tsx infrastructure/scripts/release-gate.ts staging-status <<< "$1" > staging-status-evidence.json
            jq '.status' staging-status-evidence.json > commit-status.json
            gh api "repos/$GH_REPOSITORY/statuses/$CANDIDATE_SHA" --method POST --input commit-status.json > /dev/null
          }
          gh api "repos/$GH_REPOSITORY/commits/$CANDIDATE_SHA/statuses?per_page=100" > prior-statuses.json
          prior_status="$(jq -c '[.[] | select(.context == "AI Operations / Staging capability acceptance")][0] // empty' prior-statuses.json)"
          if [[ -z "$prior_status" ]]; then
            post_status "{\"candidateSha\":\"$CANDIDATE_SHA\",\"currentPullRequestHeadSha\":\"$CANDIDATE_SHA\",\"state\":\"pending\",\"phase\":\"required_checks\"}"
          fi
          gh api "repos/$GH_REPOSITORY/actions/runs?head_sha=$CANDIDATE_SHA&per_page=100" > candidate-runs.json
          required='["CI","Database","Edge functions","E2E","Security","Performance","Windows worker foundation","CodeQL Advanced","Dependency review"]'
          CANDIDATE_SHA="$CANDIDATE_SHA" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { workflow_runs: workflowRuns } = JSON.parse(readFileSync('candidate-runs.json', 'utf8'));
          writeFileSync('workflow-runs-input.json', JSON.stringify({ candidateSha: process.env.CANDIDATE_SHA, workflowRuns }) + '\n');
          NODE
          pnpm exec tsx infrastructure/scripts/release-gate.ts latest-required-workflow-runs < workflow-runs-input.json > latest-workflow-runs.json
          latest="$(jq -c '.workflowRuns' latest-workflow-runs.json)"
          failed="$(jq --argjson latest "$latest" 'any($latest[]; .status == "completed" and .conclusion != "success")' <<< '{}')"
          if [[ "$failed" == "true" ]]; then
            post_status "{\"candidateSha\":\"$CANDIDATE_SHA\",\"currentPullRequestHeadSha\":\"$CANDIDATE_SHA\",\"state\":\"failure\",\"failureCode\":\"pr_checks_failed\"}"
            echo "candidate_ready=false" >> "$GITHUB_OUTPUT"
            echo "A required exact-SHA PR workflow failed; staging is not started."
            exit 0
          fi
          complete="$(jq --argjson required "$required" --argjson latest "$latest" '([ $latest[].name ] | unique) == ($required | sort) and all($latest[]; .status == "completed")' <<< '{}')"
          if [[ "$complete" != "true" ]]; then
            echo "Required exact-SHA PR workflow attempts are still pending; staging is not started."
            echo "candidate_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prior_state="$(jq -r '.state // empty' <<< "$prior_status")"
          prior_description="$(jq -r '.description // empty' <<< "$prior_status")"
          if [[ "$prior_state" == "success" || ( "$prior_state" == "pending" && "$prior_description" != "Required pull request checks are incomplete." ) || ( "$prior_state" == "failure" && "$prior_description" != "Staging acceptance failed: pr_checks_failed." && "$prior_description" != "Staging acceptance failed: staging_slot_busy." ) ]]; then
            echo "Candidate already has staging acceptance in progress/completed or requires operator recovery; duplicate deployment is skipped."
            echo "candidate_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -n --arg sha "$CANDIDATE_SHA" --argjson pr "$pr_number" --argjson required "$required" --argjson latest "$latest" '
            {candidateSha:$sha,pullRequestHeadSha:$sha,prNumber:$pr,baseBranch:"main",sameRepository:true,pullRequestOpen:true,
             checks:[$required[] as $name | ($latest[] | select(.name == $name)) | {name:.name,headSha:.head_sha,conclusion:(if .conclusion == "success" then "success" else "failure" end)}]}
          ' > candidate-readiness-input.json
          pnpm exec tsx infrastructure/scripts/release-gate.ts candidate-readiness < candidate-readiness-input.json > candidate-readiness.json
          echo "candidate_ready=true" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - name: Upload exact-SHA candidate admission evidence
        if: steps.validate.outputs.candidate_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-readiness-${{ steps.validate.outputs.candidate_sha }}
          path: candidate-readiness.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: gate
    if: needs.gate.outputs.candidate_ready == 'true'
    uses: ./.github/workflows/deploy-staging.yml
    with:
      candidate_sha: ${{ needs.gate.outputs.candidate_sha }}
    secrets: inherit
